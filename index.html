<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mes Recettes">
  <title>Mes Recettes</title>
  <meta name="theme-color" content="#8b5941">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-header:      #8b5941;
      --color-header-dark: #6d4a38;
      --color-btn:         #c08552;
      --color-btn-dark:    #a67c52;
      --color-btn-text:    white;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); font-family:'Cormorant Garamond',serif; background:linear-gradient(135deg,#f5e6d3 0%,#e8d5c4 100%); min-height:100vh; -webkit-font-smoothing:antialiased; }
    .recipe-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(139,89,65,0.1); transition:all 0.4s cubic-bezier(0.4,0,0.2,1); cursor:pointer; position:relative; }
    .recipe-card:hover { transform:translateY(-8px); box-shadow:0 12px 40px rgba(139,89,65,0.2); }
    .recipe-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--color-btn),var(--color-btn-dark)); opacity:0; transition:opacity 0.3s; }
    .recipe-card:hover::before { opacity:1; }
    .btn-primary { background:linear-gradient(135deg,var(--color-btn) 0%,var(--color-btn-dark) 100%); color:var(--color-btn-text); border:none; padding:12px 28px; border-radius:25px; font-family:'Lato',sans-serif; font-weight:600; cursor:pointer; transition:all 0.3s; box-shadow:0 4px 15px rgba(0,0,0,0.15); font-size:15px; }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.22); }
    .btn-secondary { background:transparent; color:var(--color-header); border:2px solid var(--color-header); padding:10px 24px; border-radius:25px; font-family:'Lato',sans-serif; font-weight:600; cursor:pointer; transition:all 0.3s; font-size:14px; }
    .btn-secondary:hover { background:var(--color-header); color:white; }
    .input-field { width:100%; padding:14px 18px; border:2px solid #e8d5c4; border-radius:12px; font-family:'Lato',sans-serif; font-size:15px; transition:all 0.3s; background:white; }
    .input-field:focus { outline:none; border-color:var(--color-btn); box-shadow:0 0 0 3px rgba(0,0,0,0.06); }
    .fade-in { animation:fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; animation:fadeIn 0.3s; padding:20px; overflow-y:auto; }
    .modal-content { background:white; border-radius:20px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; animation:slideUp 0.3s; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    @keyframes slideUp { from{opacity:0;transform:translateY(50px)} to{opacity:1;transform:translateY(0)} }
    .category-badge { display:inline-block; padding:6px 14px; background:linear-gradient(135deg,#f5e6d3,#e8d5c4); color:var(--color-header); border-radius:20px; font-size:13px; font-weight:600; font-family:'Lato',sans-serif; }
    .time-badge { display:flex; align-items:center; gap:4px; color:var(--color-header); font-family:'Lato',sans-serif; font-size:14px; }
    .filter-chip { padding:8px 16px; border-radius:20px; border:2px solid #e8d5c4; background:white; cursor:pointer; transition:all 0.3s; font-family:'Lato',sans-serif; font-size:14px; color:var(--color-header); }
    .filter-chip:hover { border-color:var(--color-btn); }
    .filter-chip.active { background:linear-gradient(135deg,var(--color-btn),var(--color-btn-dark)); color:var(--color-btn-text); border-color:transparent; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--color-header); opacity:0.7; }
    .tab-btn { display:flex; align-items:center; gap:8px; padding:9px 20px; border-radius:20px; border:none; cursor:pointer; font-family:Lato,sans-serif; font-size:14px; font-weight:600; transition:all 0.25s; }
    .tab-active { background:white; color:var(--color-header); }
    .tab-inactive { background:rgba(255,255,255,0.15); color:#f5e6d3; }
    .shop-item { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:12px; background:#fafafa; margin-bottom:8px; transition:background 0.2s; }
    .shop-item.done { opacity:0.55; }
    .check-circle { width:26px; height:26px; border-radius:50%; border:2px solid var(--color-btn); background:white; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
    .check-circle.checked { background:var(--color-btn); }
    textarea { resize:vertical; font-family:'Lato',sans-serif; }
    select { cursor:pointer; }
    .icon { display:inline-block; width:20px; height:20px; vertical-align:middle; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ── Icônes SVG ────────────────────────────────────────────────────
const ic = {
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
  plus:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  clock:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
  chef:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" x2="18" y1="17" y2="17"/></svg>`,
  x:        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  edit:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>`,
  trash:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  filter:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>`,
  camera:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
  trash2:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  upload:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  palette:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>`,
  cart:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`,
  check:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
};

// ── Thèmes ──────────────────────────────────────────────────────────
const THEMES = [
  { label:'Terracotta', h:'#8b5941', hd:'#6d4a38', b:'#c08552', bd:'#a67c52', bt:'white' },
  { label:'Sauge',      h:'#B9C88D', hd:'#9aab6e', b:'#B7B009', bd:'#9a9407', bt:'white' },
  { label:'Rose',       h:'#C1717E', hd:'#a55563', b:'#AF3C7D', bd:'#922f68', bt:'white' },
  { label:'Violet',     h:'#2E1980', hd:'#1e1060', b:'#D9CDE0', bd:'#c4b6cd', bt:'#2E1980' },
];

function applyTheme(idx, save=true) {
  const t = THEMES[idx], r = document.documentElement;
  r.style.setProperty('--color-header',      t.h);
  r.style.setProperty('--color-header-dark', t.hd);
  r.style.setProperty('--color-btn',         t.b);
  r.style.setProperty('--color-btn-dark',    t.bd);
  r.style.setProperty('--color-btn-text',    t.bt);
  if (save) localStorage.setItem('app-theme', idx);
  S.theme = idx;
}

// ── Stockage localStorage ────────────────────────────────────────────
const store = {
  get:    k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch{return null;} },
  set:    (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;} },
  del:    k => { try{localStorage.removeItem(k);return true;}catch{return false;} },
  list:   prefix => { const ks=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(prefix))ks.push(k);} return ks; },
};

// ── État global ──────────────────────────────────────────────────────
const S = {
  recipes: [], loading: true,
  search: '', category: 'Toutes', maxTime: '',
  view: 'recipes',          // 'recipes' | 'shopping'
  showForm: false, editRec: null, photo: null,
  detail: null,
  showThemes: false, theme: 0,
  shopItems: [],            // { id, name, checked }
};
const CATS = ['Toutes','Entrée','Plat principal','Dessert','Apéritif','Salade','Soupe','Autre'];

// ── Recettes ──────────────────────────────────────────────────────────
function loadRecipes() {
  S.recipes = store.list('recipe:').map(k=>store.get(k)).filter(Boolean);
  S.loading = false; render();
}
function saveRecipe(rec) {
  rec.id = rec.id || Date.now().toString();
  rec.createdAt = rec.createdAt || new Date().toISOString();
  store.set('recipe:'+rec.id, rec);
  loadRecipes(); S.showForm=false; S.editRec=null; render();
}
function deleteRecipe(id) {
  if (!confirm('Supprimer cette recette ?')) return;
  store.del('recipe:'+id); loadRecipes(); S.detail=null; render();
}

// ── Liste de courses ────────────────────────────────────────────────
function loadShop() { S.shopItems = store.get('shopping') || []; }
function saveShop() { store.set('shopping', S.shopItems); }

// ── Filtrage ─────────────────────────────────────────────────────────
function filtered() {
  return S.recipes.filter(r => {
    const q = S.search.toLowerCase();
    const ok1 = !q || r.name.toLowerCase().includes(q) || r.ingredients.toLowerCase().includes(q);
    const ok2 = S.category==='Toutes' || r.category===S.category;
    const ok3 = !S.maxTime || ((parseInt(r.prepTime)||0)+(parseInt(r.cookTime)||0)) <= parseInt(S.maxTime);
    return ok1 && ok2 && ok3;
  });
}

// ── Rendu ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML =
    renderHeader() +
    '<div style="max-width:1200px;margin:0 auto;padding:40px 20px;">' +
    (S.view==='recipes' ? renderFilters()+renderGrid() : renderShopping()) +
    '</div>' +
    (S.showForm||S.editRec ? renderForm() : '') +
    (S.detail ? renderDetail() : '');
}

// ── Header ────────────────────────────────────────────────────────────
function themeDropdown() {
  if (!S.showThemes) return '';
  let html = '<div style="position:absolute;top:50px;right:0;background:white;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.18);padding:12px;display:flex;flex-direction:column;gap:6px;z-index:2000;min-width:165px;">';
  THEMES.forEach((t,i) => {
    const act = S.theme===i;
    html += '<button onclick="A.setTheme('+i+')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:none;background:'+(act?'#f5e6d3':'transparent')+';cursor:pointer;font-family:Lato,sans-serif;font-size:14px;font-weight:'+(act?700:500)+';color:#2c2c2c;text-align:left;width:100%;" onmouseover="this.style.background=\'#f5e6d3\'" onmouseout="this.style.background=\''+(act?'#f5e6d3':'transparent')+'\'">'
      + '<span style="display:flex;gap:3px;flex-shrink:0;">'
      + '<span style="width:14px;height:14px;border-radius:50%;background:'+t.h+';border:1.5px solid #ddd;display:inline-block;"></span>'
      + '<span style="width:14px;height:14px;border-radius:50%;background:'+t.b+';border:1.5px solid #ddd;display:inline-block;"></span>'
      + '</span>' + t.label + (act?'<span style="margin-left:auto;">✓</span>':'') + '</button>';
  });
  return html + '</div>';
}

function renderHeader() {
  const nbShop = S.shopItems.filter(i=>!i.checked).length;
  return `
  <div style="background:linear-gradient(135deg,var(--color-header) 0%,var(--color-header-dark) 100%);padding:32px 20px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.1);">
    <div style="max-width:1200px;margin:0 auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="icon" style="width:40px;height:40px;color:#f5e6d3;">${ic.chef}</div>
          <h1 style="font-size:42px;color:#f5e6d3;font-weight:300;letter-spacing:1px;">Mes Recettes</h1>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <button onclick="A.exportRec()" style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.15);color:#f5e6d3;border:2px solid rgba(255,255,255,0.4);padding:10px 18px;border-radius:25px;font-family:Lato,sans-serif;font-weight:600;font-size:14px;cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
            <span class="icon" style="width:18px;height:18px;">${ic.download}</span>Exporter
          </button>
          <button onclick="document.getElementById('importInput').click()" style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.15);color:#f5e6d3;border:2px solid rgba(255,255,255,0.4);padding:10px 18px;border-radius:25px;font-family:Lato,sans-serif;font-weight:600;font-size:14px;cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
            <span class="icon" style="width:18px;height:18px;">${ic.upload}</span>Importer
          </button>
          <input type="file" id="importInput" accept=".json" style="display:none" onchange="A.importRec(this)">
          <div style="position:relative;">
            <button onclick="A.toggleThemes()" title="Thème" style="display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.15);cursor:pointer;color:#f5e6d3;" onmouseover="this.style.background='rgba(255,255,255,0.28)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
              <span class="icon" style="width:20px;height:20px;">${ic.palette}</span>
            </button>
            ${themeDropdown()}
          </div>
          <button id="installBtn" onclick="installApp()" style="display:none;align-items:center;gap:7px;background:rgba(255,255,255,0.15);color:#f5e6d3;border:2px solid rgba(255,255,255,0.4);padding:10px 18px;border-radius:25px;font-family:Lato,sans-serif;font-weight:600;font-size:14px;cursor:pointer;">📲 Installer</button>
          <button class="btn-primary" onclick="A.showForm()" style="display:flex;align-items:center;gap:8px;">
            <span class="icon">${ic.plus}</span>Nouvelle Recette
          </button>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="tab-btn ${S.view==='recipes'?'tab-active':'tab-inactive'}" onclick="A.setView('recipes')">
          <span class="icon" style="width:16px;height:16px;">${ic.chef}</span>
          Mes Recettes
          <span style="background:${S.view==='recipes'?'var(--color-header)':'rgba(255,255,255,0.3)'};color:white;border-radius:10px;padding:1px 8px;font-size:12px;">${S.recipes.length}</span>
        </button>
        <button class="tab-btn ${S.view==='shopping'?'tab-active':'tab-inactive'}" onclick="A.setView('shopping')">
          <span class="icon" style="width:16px;height:16px;">${ic.cart}</span>
          Liste de courses
          ${nbShop>0?'<span style="background:'+(S.view==='shopping'?'var(--color-header)':'rgba(255,255,255,0.3)')+';color:white;border-radius:10px;padding:1px 8px;font-size:12px;">'+nbShop+'</span>':''}
        </button>
      </div>
    </div>
  </div>`;
}

// ── Filtres ────────────────────────────────────────────────────────────
function renderFilters() {
  return `
  <div class="fade-in" style="margin-bottom:40px;">
    <div style="display:flex;gap:10px;margin-bottom:24px;align-items:center;">
      <div style="position:relative;flex:1;">
        <div class="icon" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--color-header);opacity:0.5;">${ic.search}</div>
        <input id="searchInput" type="text" class="input-field" placeholder="Rechercher une recette ou un ingrédient..." value="${S.search}" style="padding-left:50px;padding-right:48px;" onkeydown="if(event.key==='Enter')A.search()">
        ${S.search?'<button onclick="A.clearSearch()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--color-header);opacity:0.5;padding:4px;display:flex;align-items:center;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5"><span class="icon" style="width:18px;height:18px;">${ic.x}</span></button>':''}
      </div>
      <button class="btn-primary" onclick="A.search()" style="padding:14px 22px;white-space:nowrap;display:flex;align-items:center;gap:8px;">
        <span class="icon">${ic.search}</span>Rechercher
      </button>
    </div>
    <div style="background:white;padding:24px;border-radius:16px;box-shadow:0 2px 12px rgba(139,89,65,0.08);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--color-header);">
        <div class="icon">${ic.filter}</div>
        <span style="font-family:Lato,sans-serif;font-weight:600;">Filtres</span>
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:10px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Catégorie</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${CATS.map(c=>'<button class="filter-chip'+(S.category===c?' active':'')+'" onclick="A.setCat(\''+c+'\')">' +c+'</button>').join('')}
        </div>
      </div>
      <div>
        <label style="display:block;margin-bottom:10px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Temps maximum (minutes)</label>
        <input type="number" placeholder="Ex: 30" class="input-field" value="${S.maxTime}" oninput="A.setTime(this.value)" style="max-width:200px;">
      </div>
    </div>
  </div>`;
}

// ── Grille recettes ───────────────────────────────────────────────────
function recipeCard(r, idx) {
  const photo  = r.photo ? '<div style="height:180px;overflow:hidden;border-radius:16px 16px 0 0;"><img src="'+r.photo+'" style="width:100%;height:100%;object-fit:cover;display:block;"></div>' : '';
  const prep   = r.prepTime ? '<div class="time-badge"><span class="icon">'+ic.clock+'</span><span>Prép: '+r.prepTime+'min</span></div>' : '';
  const cook   = r.cookTime ? '<div class="time-badge"><span class="icon">'+ic.clock+'</span><span>Cuisson: '+r.cookTime+'min</span></div>' : '';
  const first  = (r.ingredients||'').split('\n')[0];
  return '<div class="recipe-card fade-in" onclick="A.openDetail(\''+r.id+'\')" style="animation-delay:'+(idx*0.1)+'s;">'
    + photo
    + '<div style="padding:24px;">'
    + '<div style="margin-bottom:16px;"><span class="category-badge">'+r.category+'</span></div>'
    + '<h3 style="font-size:26px;color:#2c2c2c;margin-bottom:12px;font-weight:600;">'+r.name+'</h3>'
    + '<div style="display:flex;gap:20px;margin-bottom:16px;">'+prep+cook+'</div>'
    + '<p style="font-family:Lato,sans-serif;font-size:14px;color:#666;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;">'+first+'...</p>'
    + '</div></div>';
}

function renderGrid() {
  const recs = filtered();
  if (S.loading) return '<div class="empty-state"><p style="font-size:18px;font-family:Lato,sans-serif;">Chargement...</p></div>';
  if (!recs.length) return '<div class="empty-state"><div class="icon" style="width:60px;height:60px;">'+ic.chef+'</div><p style="font-size:24px;margin-top:20px;font-weight:300;">'+(S.recipes.length?'Aucun résultat':'Aucune recette')+'</p><p style="font-size:16px;margin-top:10px;font-family:Lato,sans-serif;">'+(S.recipes.length?'Modifiez vos filtres':'Ajoutez votre première recette !')+'</p></div>';

  const isFiltered = S.search || S.category !== 'Toutes' || S.maxTime;
  const countBar = isFiltered
    ? '<div style="font-family:Lato,sans-serif;font-size:15px;color:var(--color-header);margin-bottom:20px;display:flex;align-items:center;gap:8px;">'
      + '<span style="background:var(--color-btn);color:var(--color-btn-text);border-radius:20px;padding:3px 14px;font-weight:700;font-size:16px;">'+recs.length+'</span>'
      + (recs.length > 1 ? 'recettes trouvées' : 'recette trouvée')
      + (S.recipes.length !== recs.length ? ' <span style="opacity:0.55;">sur ' + S.recipes.length + '</span>' : '')
      + '</div>'
    : '';

  return countBar + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px;">' + recs.map(recipeCard).join('') + '</div>';
}

// ── Liste de courses (Solution A — manuelle) ─────────────────────────
function shopRow(item) {
  const name = item.checked
    ? '<span style="font-family:Lato,sans-serif;font-size:15px;color:#aaa;flex:1;text-decoration:line-through;">'+item.name+'</span>'
    : '<span style="font-family:Lato,sans-serif;font-size:15px;color:#2c2c2c;flex:1;">'+item.name+'</span>';
  const circle = item.checked
    ? '<div class="check-circle checked" onclick="A.toggleShop(\''+item.id+'\')"><span class="icon" style="width:14px;height:14px;color:var(--color-btn-text);">'+ic.check+'</span></div>'
    : '<div class="check-circle" onclick="A.toggleShop(\''+item.id+'\')"></div>';
  return '<div class="shop-item'+(item.checked?' done':'')+'">'
    + circle + name
    + '<button onclick="A.removeShop(\''+item.id+'\')" style="background:transparent;border:none;cursor:pointer;color:#ccc;padding:4px;display:flex;align-items:center;" onmouseover="this.style.color=\'#d63031\'" onmouseout="this.style.color=\'#ccc\'"><span class="icon" style="width:16px;height:16px;">'+ic.x+'</span></button>'
    + '</div>';
}

function renderShopping() {
  const todo = S.shopItems.filter(i=>!i.checked);
  const done = S.shopItems.filter(i=>i.checked);
  let body = '';
  if (!S.shopItems.length) {
    body = '<div class="empty-state"><div class="icon" style="width:60px;height:60px;">'+ic.cart+'</div><p style="font-size:24px;margin-top:20px;font-weight:300;">La liste est vide</p><p style="font-size:16px;margin-top:10px;font-family:Lato,sans-serif;">Ajoutez vos articles ci-dessus</p></div>';
  } else {
    if (todo.length) {
      body += '<div style="background:white;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(139,89,65,0.08);margin-bottom:20px;">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'
        + '<h3 style="font-size:18px;color:var(--color-header);font-weight:600;font-family:Lato,sans-serif;">À acheter ('+todo.length+')</h3>'
        + '<button onclick="A.clearAll()" style="font-family:Lato,sans-serif;font-size:13px;color:#d63031;background:transparent;border:none;cursor:pointer;">Tout vider</button>'
        + '</div>' + todo.map(shopRow).join('') + '</div>';
    }
    if (done.length) {
      body += '<div style="background:white;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(139,89,65,0.08);">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'
        + '<h3 style="font-size:18px;color:#aaa;font-weight:600;font-family:Lato,sans-serif;">Dans le panier ('+done.length+')</h3>'
        + '<button onclick="A.clearDone()" style="font-family:Lato,sans-serif;font-size:13px;color:#d63031;background:transparent;border:none;cursor:pointer;">Supprimer cochés</button>'
        + '</div>' + done.map(shopRow).join('') + '</div>';
    }
  }
  return `
  <div class="fade-in">
    <div style="background:white;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(139,89,65,0.08);margin-bottom:28px;">
      <h2 style="font-size:22px;color:var(--color-header);font-weight:600;margin-bottom:16px;font-family:Lato,sans-serif;">Ajouter un article</h2>
      <div style="display:flex;gap:10px;">
        <input id="shopInput" type="text" class="input-field" placeholder="Ex: 500g de farine, beurre, œufs..." style="flex:1;" onkeydown="if(event.key==='Enter')A.addShop()">
        <button class="btn-primary" onclick="A.addShop()" style="padding:14px 22px;display:flex;align-items:center;gap:8px;white-space:nowrap;">
          <span class="icon">${ic.plus}</span>Ajouter
        </button>
      </div>
    </div>
    ${body}
  </div>`;
}

// ── Formulaire recette ────────────────────────────────────────────────
function renderForm() {
  const r = S.editRec || { name:'', category:'Plat principal', prepTime:'', cookTime:'', ingredients:'', instructions:'', notes:'' };
  const photo = S.photo || r.photo || null;
  const photoHtml = photo
    ? '<img id="photoPreview" src="'+photo+'" style="width:100%;max-height:260px;object-fit:cover;display:block;border-radius:14px;">'
    : '<div id="photoPlaceholder" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px;color:var(--color-btn);"><div class="icon" style="width:40px;height:40px;">'+ic.camera+'</div><span style="font-family:Lato,sans-serif;font-size:14px;font-weight:600;">Prendre une photo ou choisir depuis la galerie</span></div>';
  return `
  <div class="modal-overlay" onclick="A.closeForm(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div style="padding:32px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;">
        <h2 style="font-size:32px;color:#2c2c2c;font-weight:600;">${r.id?'Modifier':'Nouvelle recette'}</h2>
        <button onclick="A.closeForm()" style="background:transparent;border:none;cursor:pointer;color:var(--color-header);padding:8px;"><div class="icon" style="width:24px;height:24px;">${ic.x}</div></button>
      </div>
      <form id="recipeForm" onsubmit="A.submitForm(event)" style="padding:32px;">
        <input type="hidden" id="fId" value="${r.id||''}">
        <input type="hidden" id="fCreated" value="${r.createdAt||''}">

        <div style="margin-bottom:24px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Photo</label>
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="A.handlePhoto(this)">
          <div style="position:relative;border-radius:14px;overflow:hidden;background:#f5e6d3;cursor:pointer;" onclick="document.getElementById('photoInput').click()">
            ${photoHtml}
          </div>
          ${photo?'<button type="button" onclick="A.removePhoto()" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:transparent;border:1.5px solid #d63031;color:#d63031;padding:6px 14px;border-radius:20px;font-family:Lato,sans-serif;font-size:13px;cursor:pointer;"><span class="icon" style="width:15px;height:15px;">'+ic.trash2+'</span>Supprimer la photo</button>':''}
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Nom de la recette *</label>
          <input type="text" class="input-field" id="fName" value="${r.name}" required>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:24px;">
          <div>
            <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Catégorie</label>
            <select class="input-field" id="fCat">${CATS.filter(c=>c!=='Toutes').map(c=>'<option value="'+c+'"'+(r.category===c?' selected':'')+'>'+c+'</option>').join('')}</select>
          </div>
          <div>
            <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Préparation (min)</label>
            <input type="number" class="input-field" id="fPrep" value="${r.prepTime}">
          </div>
          <div>
            <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Cuisson (min)</label>
            <input type="number" class="input-field" id="fCook" value="${r.cookTime}">
          </div>
        </div>
        <div style="margin-bottom:24px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Ingrédients * <span style="font-weight:400;opacity:0.7;">(un par ligne)</span></label>
          <textarea class="input-field" id="fIngr" rows="8" placeholder="200g de farine&#10;3 œufs&#10;250ml de lait..." required>${r.ingredients}</textarea>
        </div>
        <div style="margin-bottom:24px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Instructions * <span style="font-weight:400;opacity:0.7;">(étapes)</span></label>
          <textarea class="input-field" id="fInstr" rows="10" placeholder="1. Préchauffez le four à 180°C&#10;2. ..." required>${r.instructions}</textarea>
        </div>
        <div style="margin-bottom:32px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">Notes <span style="font-weight:400;opacity:0.7;">(astuces, variantes, conseils...)</span></label>
          <textarea class="input-field" id="fNotes" rows="5" placeholder="Ex: Se conserve 3 jours au réfrigérateur...">${r.notes||''}</textarea>
        </div>
        <div style="margin-bottom:32px;">
          <label style="display:block;margin-bottom:8px;font-family:Lato,sans-serif;font-size:14px;color:var(--color-header);font-weight:600;">🔗 Lien web <span style="font-weight:400;opacity:0.7;">(source, inspiration, vidéo...)</span></label>
          <input type="url" class="input-field" id="fUrl" value="${r.url||''}" placeholder="https://www.example.com/recette">
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <button type="button" class="btn-secondary" onclick="A.closeForm()">Annuler</button>
          <button type="submit" class="btn-primary">${r.id?'Mettre à jour':'Enregistrer'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

// ── Détail recette ────────────────────────────────────────────────────
function renderDetail() {
  const r = S.detail;
  const photo = r.photo ? '<div style="height:240px;overflow:hidden;border-radius:20px 20px 0 0;"><img src="'+r.photo+'" style="width:100%;height:100%;object-fit:cover;display:block;"></div>' : '';
  const prep  = r.prepTime ? '<div class="time-badge" style="font-size:15px;"><span class="icon">'+ic.clock+'</span><span>Préparation: '+r.prepTime+' min</span></div>' : '';
  const cook  = r.cookTime ? '<div class="time-badge" style="font-size:15px;"><span class="icon">'+ic.clock+'</span><span>Cuisson: '+r.cookTime+' min</span></div>' : '';
  const notes = r.notes ? '<div style="background:#f9f6f2;border-left:4px solid var(--color-btn);border-radius:0 12px 12px 0;padding:20px 24px;margin-top:32px;"><h3 style="font-size:18px;color:var(--color-header);margin-bottom:10px;font-weight:600;">📝 Notes</h3><div style="font-family:Lato,sans-serif;font-size:15px;line-height:1.8;color:#2c2c2c;white-space:pre-line;">'+r.notes+'</div></div>' : '';
  const urlBlock = r.url ? '<div style="margin-top:24px;"><a href="'+r.url+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:10px;padding:12px 22px;background:linear-gradient(135deg,var(--color-btn),var(--color-btn-dark));color:white;border-radius:25px;text-decoration:none;font-family:Lato,sans-serif;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,0.15);">🔗 Voir la recette en ligne</a></div>' : '';
  return `
  <div class="modal-overlay" onclick="A.closeDetail(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      ${photo}
      <div style="padding:32px;border-bottom:1px solid #f0f0f0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
          <div style="flex:1;">
            <span class="category-badge" style="margin-bottom:12px;display:inline-block;">${r.category}</span>
            <h2 style="font-size:36px;color:#2c2c2c;margin-bottom:16px;font-weight:600;">${r.name}</h2>
            <div style="display:flex;gap:24px;flex-wrap:wrap;">${prep}${cook}</div>
          </div>
          <button onclick="A.closeDetail()" style="background:transparent;border:none;cursor:pointer;color:var(--color-header);padding:8px;"><div class="icon" style="width:24px;height:24px;">${ic.x}</div></button>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;">
          <button class="btn-secondary" onclick="A.editRec('${r.id}')" style="display:flex;align-items:center;gap:8px;"><span class="icon" style="width:16px;height:16px;">${ic.edit}</span>Modifier</button>
          <button class="btn-secondary" onclick="A.deleteRec('${r.id}')" style="border-color:#d63031;color:#d63031;display:flex;align-items:center;gap:8px;"><span class="icon" style="width:16px;height:16px;">${ic.trash}</span>Supprimer</button>
        </div>
      </div>
      <div style="padding:32px;">
        <div style="margin-bottom:32px;">
          <h3 style="font-size:22px;color:var(--color-header);margin-bottom:16px;font-weight:600;">Ingrédients</h3>
          <div style="font-family:Lato,sans-serif;font-size:15px;line-height:2;color:#2c2c2c;white-space:pre-line;">${r.ingredients}</div>
        </div>
        <div>
          <h3 style="font-size:22px;color:var(--color-header);margin-bottom:16px;font-weight:600;">Instructions</h3>
          <div style="font-family:Lato,sans-serif;font-size:15px;line-height:1.8;color:#2c2c2c;white-space:pre-line;">${r.instructions}</div>
        </div>
        ${notes}
        ${urlBlock}
      </div>
    </div>
  </div>`;
}

// ── Actions (window.A) ────────────────────────────────────────────────
window.A = {
  // Navigation
  setView(v)    { S.view=v; S.showThemes=false; render(); },

  // Thème
  toggleThemes(){ S.showThemes=!S.showThemes; render(); },
  setTheme(i)   { applyTheme(i); S.showThemes=false; render(); },

  // Recettes
  showForm()    { S.showForm=true; S.photo=null; render(); },
  closeForm(e)  { if(!e||e.target===e.currentTarget){S.showForm=false;S.editRec=null;S.photo=null;render();} },
  openDetail(id){ S.detail=S.recipes.find(r=>r.id===id); render(); },
  closeDetail(e){ if(!e||e.target===e.currentTarget){S.detail=null;render();} },
  editRec(id)   { S.editRec=S.recipes.find(r=>r.id===id); S.photo=S.editRec.photo||null; S.detail=null; render(); },
  deleteRec(id) { deleteRecipe(id); },

  submitForm(e) {
    e.preventDefault();
    saveRecipe({
      id:           document.getElementById('fId').value,
      createdAt:    document.getElementById('fCreated').value,
      name:         document.getElementById('fName').value,
      category:     document.getElementById('fCat').value,
      prepTime:     document.getElementById('fPrep').value,
      cookTime:     document.getElementById('fCook').value,
      ingredients:  document.getElementById('fIngr').value,
      instructions: document.getElementById('fInstr').value,
      notes:        document.getElementById('fNotes').value,
      url:          document.getElementById('fUrl').value,
      photo:        S.photo || (S.editRec&&S.editRec.photo) || null,
    });
  },

  // Photo
  handlePhoto(input) {
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX=800; let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        S.photo=c.toDataURL('image/jpeg',0.7);
        const prev=document.getElementById('photoPreview');
        const ph=document.getElementById('photoPlaceholder');
        if(prev){prev.src=S.photo;prev.style.display='block';}
        if(ph) ph.style.display='none';
        render();
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  },
  removePhoto() { S.photo=null; render(); },

  // Recherche
  search()      { const i=document.getElementById('searchInput'); if(i){S.search=i.value;render();} },
  clearSearch() { S.search=''; render(); },
  setCat(c)     { S.category=c; render(); },
  setTime(v)    { S.maxTime=v; render(); },

  // Export / Import
  exportRec() {
    if(!S.recipes.length){alert('Aucune recette à exporter.');return;}
    const blob=new Blob([JSON.stringify(S.recipes,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='mes-recettes-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  },
  importRec(input) {
    const file=input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{
      try {
        const data=JSON.parse(e.target.result);
        if(!Array.isArray(data)) throw new Error();
        const existing=new Set(S.recipes.map(r=>r.id));
        let added=0, skipped=0;
        data.forEach(r=>{ if(!r.id||!r.name) return; if(existing.has(r.id)){skipped++;}else{store.set('recipe:'+r.id,r);added++;} });
        loadRecipes(); input.value='';
        let msg='✅ '+added+' recette(s) ajoutée(s).';
        if(skipped) msg+='\n'+skipped+' ignorée(s) (déjà présentes).';
        alert(msg);
      } catch { alert('❌ Fichier invalide.'); input.value=''; }
    };
    reader.readAsText(file);
  },

  // Liste de courses
  addShop() {
    const i=document.getElementById('shopInput');
    const name=(i?i.value:'').trim(); if(!name) return;
    S.shopItems.push({id:Date.now().toString(),name,checked:false});
    saveShop(); render();
  },
  toggleShop(id) {
    const item=S.shopItems.find(i=>i.id===id);
    if(item){item.checked=!item.checked; saveShop(); render();}
  },
  removeShop(id) { S.shopItems=S.shopItems.filter(i=>i.id!==id); saveShop(); render(); },
  clearDone()    { S.shopItems=S.shopItems.filter(i=>!i.checked); saveShop(); render(); },
  clearAll()     { if(confirm('Vider toute la liste ?')){S.shopItems=[];saveShop();render();} },
};

// ── Initialisation ────────────────────────────────────────────────────
applyTheme(parseInt(localStorage.getItem('app-theme')||'0'), false);
loadShop();
loadRecipes();
</script>
<script>
// ── PWA : service worker + installation ──────────────────────────
var deferredInstall=null;
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.log('SW',e);});
  });
}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredInstall=e;
  var b=document.getElementById('installBtn'); if(b) b.style.display='inline-flex';
});
window.addEventListener('appinstalled',function(){
  deferredInstall=null;
  var b=document.getElementById('installBtn'); if(b) b.style.display='none';
});
function installApp(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(){deferredInstall=null;var b=document.getElementById('installBtn');if(b)b.style.display='none';});
}
</script>
</body>
</html>
